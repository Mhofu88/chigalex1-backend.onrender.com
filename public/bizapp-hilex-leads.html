<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BizApp ZW • HILEX Leads</title>
<style>body{margin:0;background:#0f0a1e;color:#fff;font-family:system-ui}.w{max-width:1100px;margin:auto;padding:20px}h1{color:#ffd700}.bar,.card{background:#1e1650;border:1px solid #ffffff16;border-radius:20px;padding:16px;margin:12px 0}input,select,textarea{background:#0f0a1e;color:white;border:1px solid #ffffff20;border-radius:12px;padding:11px;width:100%;box-sizing:border-box}button{background:#7c3aed;color:white;border:0;border-radius:999px;padding:11px 16px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#251a55;border-radius:14px;padding:14px;text-align:center}.stat b{font-size:1.6rem;color:#ffd700}.meta{color:#ffffff90;font-size:.85rem}.lead{display:grid;grid-template-columns:1fr auto;gap:14px}.pill{display:inline-block;background:#ffffff12;border-radius:999px;padding:5px 9px;margin:3px;font-size:.78rem}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.lead{grid-template-columns:1fr}}</style></head><body><div class="w">
<h1>🚀 BizApp ZW • HILEX Lead Control</h1><p class="meta">Companion control screen for your existing Chigalex1 Admin Panel. Uses the same <code>adminKey</code> and backend.</p>
<div class="bar"><label>Admin key</label><input id="key" type="password"><br><br><button onclick="load()">Load LIVE Leads</button> <span id="msg"></span></div>
<div class="grid"><div class="stat"><b id="total">0</b><div>Total</div></div><div class="stat"><b id="newc">0</b><div>New</div></div><div class="stat"><b id="progress">0</b><div>In Progress</div></div><div class="stat"><b id="won">0</b><div>Won</div></div></div>
<div id="list"></div></div>
<script>
const API='https://chigalex1-backend.onrender.com';const key=document.getElementById('key');key.value=localStorage.getItem('adminKey')||'';
async function load(){localStorage.setItem('adminKey',key.value);msg.textContent='Loading…';let r=await fetch(API+'/admin/bizapp/hilex-leads',{headers:{'x-admin-key':key.value}});let j=await r.json();if(!r.ok){msg.textContent='⚠️ '+(j.error||'Failed');return}msg.textContent='✅ LIVE';render(j.leads||[])}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(a){total.textContent=a.length;newc.textContent=a.filter(x=>x.status==='New').length;progress.textContent=a.filter(x=>x.status==='In Progress').length;won.textContent=a.filter(x=>x.status==='Won').length;
 list.innerHTML=a.map(x=>`<div class="card lead"><div><h3>${esc(x.businessName)} <span class="pill">${esc(x.reference)}</span></h3><div class="meta">${esc(x.contactName)} • ${esc(x.country)} • ${esc(x.phone)} ${x.email?'• '+esc(x.email):''}</div><p><b>Recommended:</b> ${esc(x.recommendedPath)}</p><div>${(x.gaps||[]).map(y=>'<span class="pill">'+esc(y)+'</span>').join('')}</div><p class="meta">${esc(x.notes)}</p></div><div style="min-width:210px"><select id="s${x.id}">${['New','Contacted','Qualified','Quoted','In Progress','Won','Lost','Hold'].map(s=>`<option ${x.status===s?'selected':''}>${s}</option>`).join('')}</select><textarea id="n${x.id}" placeholder="Private admin note">${esc(x.adminNote||'')}</textarea><button onclick="save('${x.id}')">Save LIVE</button></div></div>`).join('')||'<div class="card">No HILEX leads yet.</div>'}
async function save(id){let r=await fetch(API+'/admin/bizapp/hilex-leads/status',{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':key.value},body:JSON.stringify({id,status:document.getElementById('s'+id).value,adminNote:document.getElementById('n'+id).value})});if(r.ok)load();else alert('Save failed')}
</script></body></html>
